name: SiteForge template apply fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/siteforge-template-apply-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix template persistence race
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          old = "    window.addEventListener('beforeunload', persistNow);"
          new = "    window.addEventListener('beforeunload', () => {\n      if (sessionStorage.getItem('siteforge_skip_beforeunload_persist') === '1') {\n        sessionStorage.removeItem('siteforge_skip_beforeunload_persist');\n        return;\n      }\n      persistNow();\n    });"
          if old in s:
              s = s.replace(old, new, 1)
          elif "siteforge_skip_beforeunload_persist" not in s:
              raise SystemExit('beforeunload marker not found')
          app.write_text(s, encoding='utf-8')

          premium = Path('v8-premium-templates.js')
          p = premium.read_text(encoding='utf-8')
          old2 = "    map[next.id] = next;\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(map));\n    localStorage.setItem(ACTIVE_KEY, next.id);\n    location.reload();"
          new2 = "    map[next.id] = next;\n    sessionStorage.setItem('siteforge_skip_beforeunload_persist', '1');\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(map));\n    localStorage.setItem(ACTIVE_KEY, next.id);\n    location.reload();"
          if old2 in p:
              p = p.replace(old2, new2, 1)
          elif "sessionStorage.setItem('siteforge_skip_beforeunload_persist', '1')" not in p:
              raise SystemExit('premium applyTemplate marker not found')
          premium.write_text(p, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check v8-premium-templates.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js v8-premium-templates.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix premium template application persistence"
          git push origin main
