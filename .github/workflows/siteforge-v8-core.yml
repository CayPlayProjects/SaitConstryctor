name: Finalize SiteForge v8 core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/siteforge-v8-core.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upgrade core version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text(encoding='utf-8')
          old = "const APP_VERSION = 7;"
          new = "const APP_VERSION = 8;"
          if old not in text and new not in text:
              raise SystemExit('APP_VERSION marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit v8 core marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize SiteForge v8 core"
          git push origin main
